spring.application.name=cp6-spring-ai-langchain4j

# Ollama
spring.ai.ollama.base-url=http://localhost:11434

# Modelo de chat (família Qwen) - usado pelo Spring AI E pelo LangChain4j
spring.ai.ollama.chat.model=qwen2.5:3b

# Modelo de embeddings (modelo dedicado a embeddings, 768 dimensões)
spring.ai.ollama.embedding.model=nomic-embed-text

# RAG
app.rag.vector-store-file=vectorstore.json
app.rag.top-k=3

# Tempo máximo (s) esperando o modelo responder (1ª chamada carrega o modelo na memória)
app.chat.timeout-seconds=120
